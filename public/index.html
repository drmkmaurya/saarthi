<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>सारथी (Saarthi) - AI Wellness & Vastu Assistant</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f97316" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Devanagari', 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-50 text-slate-800 antialiased">

  <!-- 1. Loading Screen -->
  <div id="loadingScreen" class="min-h-screen flex flex-col items-center justify-center gap-3">
    <div class="w-9 h-9 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm font-medium text-slate-600">सारथी लोड हो रहा है...</p>
  </div>

  <!-- 2. Google Login Screen -->
  <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-amber-50 via-stone-50 to-orange-50">
    <div class="bg-white max-w-sm w-full rounded-3xl p-7 shadow-xl border border-amber-200/60 text-center space-y-5">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 text-white text-3xl flex items-center justify-center shadow-md">🌅</div>
      <div>
        <h1 class="text-2xl font-bold text-slate-800">सारथी (Saarthi)</h1>
        <p class="text-xs text-slate-500 mt-1">एक्यूप्रेशर, वास्तु शास्त्र एवं सुप्रभात सहायक</p>
      </div>
      <button onclick="loginWithGoogle()" class="w-full py-3 px-4 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center gap-2.5 shadow-md transition">
        <img src="https://www.google.com/favicon.ico" alt="G" class="w-4 h-4" />
        <span>Google से लॉगिन करें</span>
      </button>
    </div>
  </div>

  <!-- 3. Pending / Blocked Approval Screen -->
  <div id="pendingScreen" class="hidden min-h-screen flex items-center justify-center p-4 bg-stone-50">
    <div class="bg-white max-w-sm w-full rounded-3xl p-7 shadow-lg border border-stone-200 text-center space-y-4">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-100 text-amber-600 text-2xl flex items-center justify-center">⏳</div>
      <h2 id="pendingTitle" class="text-lg font-bold text-slate-800">एडमिन अप्रूवल प्रतीक्षारत</h2>
      <p id="pendingDesc" class="text-xs text-slate-600 leading-relaxed"></p>
      <button onclick="logoutUser()" class="w-full py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs font-semibold">दूसरे अकाउंट से लॉगिन करें</button>
    </div>
  </div>

  <!-- 4. Main Approved App -->
  <div id="mainApp" class="hidden min-h-screen flex flex-col">
    <!-- Top Header & Navigation -->
    <header class="sticky top-0 z-30 bg-gradient-to-r from-orange-600 via-amber-500 to-orange-500 text-white shadow-md">
      <div class="max-w-3xl mx-auto px-3.5 py-3 flex items-center justify-between">
        <!-- Left Drawer Button -->
        <button onclick="toggleDrawer(true)" class="p-2 rounded-xl bg-white/20 hover:bg-white/30 active:scale-95 transition">☰</button>

        <!-- Center Logo -->
        <div class="flex items-center gap-2">
          <span class="text-xl">🌅</span>
          <h1 class="text-lg sm:text-xl font-bold tracking-wide">सारथी (Saarthi)</h1>
        </div>

        <!-- Right Google Profile & Logout -->
        <div class="relative">
          <button onclick="toggleProfileMenu()" class="flex items-center gap-2 bg-white/20 hover:bg-white/30 pl-1.5 pr-2.5 py-1 rounded-full transition">
            <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-white/70 object-cover hidden" />
            <div id="userInitial" class="w-7 h-7 rounded-full bg-amber-800 flex items-center justify-center text-xs font-bold">U</div>
            <span id="userFirstName" class="text-xs font-semibold max-w-[75px] truncate hidden sm:inline">User</span>
          </button>
          <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white text-slate-800 rounded-2xl shadow-xl border border-stone-200 p-3 z-50">
            <p id="menuFullName" class="text-xs font-bold truncate"></p>
            <p id="menuEmail" class="text-[11px] text-slate-500 truncate mb-2.5"></p>
            <button onclick="logoutUser()" class="w-full py-2 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold">🚪 Logout</button>
          </div>
        </div>
      </div>

      <!-- Dynamic Module Switcher Tabs -->
      <div id="moduleTabs" class="max-w-3xl mx-auto px-3 pb-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar"></div>
    </header>

    <!-- Left Slide-Over Sidebar Drawer -->
    <div id="drawerOverlay" class="hidden fixed inset-0 z-50 flex">
      <div onclick="toggleDrawer(false)" class="fixed inset-0 bg-slate-900/50"></div>
      <aside class="relative w-72 max-w-[82vw] bg-white h-full shadow-2xl p-5 flex flex-col justify-between z-10">
        <div>
          <div class="flex items-center justify-between border-b border-stone-100 pb-4 mb-4">
            <span class="font-bold text-slate-800">✨ सारथी मेनू</span>
            <button onclick="toggleDrawer(false)" class="p-1.5 rounded-lg hover:bg-stone-100 text-slate-500">✕</button>
          </div>
          <div class="space-y-2">
            <a id="adminMenuLink" href="/admin" class="hidden w-full py-2.5 px-3.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 font-semibold text-sm flex items-center gap-2">🛡️ Admin Panel (Manage AI)</a>
            <button onclick="openMorningSettings()" class="w-full text-left py-2.5 px-3.5 rounded-xl hover:bg-stone-100 text-slate-700 font-medium text-sm">⚙️ Morning Card Settings</button>
          </div>
        </div>
        <div class="border-t border-stone-100 pt-4 text-[11px] text-slate-400">
          <p id="drawerLimitInfo">DB Chat Limit: 10 chats</p>
          <p class="mt-0.5">Local Device History: 30 Days</p>
        </div>
      </aside>
    </div>

    <!-- Container 1: Universal Chat UI (All AI Assistants share this exact UI) -->
    <main id="chatContainer" class="hidden flex-1 flex flex-col max-w-3xl w-full mx-auto h-[calc(100vh-116px)]"></main>

    <!-- Container 2: Morning Studio -->
    <main id="morningContainer" class="hidden flex-1 max-w-3xl w-full mx-auto px-3.5 py-4 space-y-5 pb-12"></main>
  </div>

  <script src="/js/morning.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
