<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>सारथी (Saarthi)</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#075E54" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Devanagari', 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .wa-canvas {
      background-color: #EFEAE2;
      background-image: radial-gradient(#d5cec2 0.85px, transparent 0.85px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="bg-[#F4F6F5] text-slate-800 antialiased selection:bg-emerald-200">

  <!-- Toast Popup -->
  <div id="toastBox" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[100] max-w-sm w-[92%] bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center justify-between gap-3 text-xs">
    <span id="toastText" class="leading-relaxed"></span>
    <button onclick="document.getElementById('toastBox').classList.add('hidden')" class="text-slate-400 hover:text-white font-bold">✕</button>
  </div>

  <!-- 1. Loading Screen -->
  <div id="loadingScreen" class="min-h-screen flex flex-col items-center justify-center gap-3">
    <div class="w-9 h-9 border-4 border-[#075E54] border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-semibold text-slate-600">सारथी लोड हो रहा है...</p>
  </div>

  <!-- 2. Google Login Screen -->
  <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center p-5 bg-gradient-to-b from-[#075E54]/10 to-[#F4F6F5]">
    <div class="bg-white max-w-sm w-full rounded-3xl p-7 shadow-lg border border-slate-200/80 text-center space-y-5">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-[#075E54] text-white text-3xl flex items-center justify-center shadow-sm">🌿</div>
      <div>
        <h1 class="text-2xl font-bold text-slate-800">सारथी (Saarthi)</h1>
        <p class="text-xs text-slate-500 mt-1">एक्यूप्रेशर, वास्तु शास्त्र एवं सुप्रभात सहायक</p>
      </div>
      <button onclick="loginWithGoogle()" class="w-full py-3.5 px-4 rounded-2xl bg-[#075E54] hover:bg-[#064c44] active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center gap-2.5 shadow-sm transition">
        <img src="https://www.google.com/favicon.ico" alt="G" class="w-4 h-4 bg-white rounded-full p-0.5" />
        <span>Google से लॉगिन करें</span>
      </button>
    </div>
  </div>

  <!-- 3. Pending Screen -->
  <div id="pendingScreen" class="hidden min-h-screen flex items-center justify-center p-5">
    <div class="bg-white max-w-sm w-full rounded-3xl p-7 shadow-lg border border-slate-200 text-center space-y-4">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-100 text-amber-700 text-2xl flex items-center justify-center">⏳</div>
      <h2 id="pendingTitle" class="text-lg font-bold text-slate-800">एडमिन अप्रूवल प्रतीक्षारत</h2>
      <p id="pendingDesc" class="text-xs text-slate-600 leading-relaxed"></p>
      <button onclick="logoutUser()" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold">दूसरे अकाउंट से लॉगिन करें</button>
    </div>
  </div>

  <!-- 4. Main App Shell (Full-Width Mobile Native, Centered cleanly on Desktop) -->
  <div id="mainApp" class="hidden min-h-screen w-full max-w-2xl mx-auto bg-white flex flex-col shadow-sm">

    <!-- VIEW A: CLEAN CARD-ONLY HOME -->
    <div id="homeView" class="flex-1 flex flex-col">
      <header class="sticky top-0 z-30 bg-[#075E54] text-white px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="toggleDrawer(true)" class="p-2 -ml-1 rounded-full hover:bg-white/15 active:scale-95 transition text-lg leading-none">☰</button>
          <div>
            <h1 class="text-lg font-bold tracking-wide leading-tight">सारथी</h1>
            <p id="welcomeGreeting" class="text-[11px] text-emerald-100/90">प्रणाम 🙏</p>
          </div>
        </div>

        <div class="relative">
          <button onclick="toggleProfileMenu()" class="flex items-center gap-1.5 bg-white/15 hover:bg-white/25 p-1 rounded-full">
            <img id="userAvatar" src="" class="w-8 h-8 rounded-full object-cover hidden" />
            <div id="userInitial" class="w-8 h-8 rounded-full bg-emerald-800 flex items-center justify-center text-xs font-bold">U</div>
          </button>
          <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white text-slate-800 rounded-2xl shadow-xl border border-slate-200 p-3.5 z-50">
            <p id="menuFullName" class="text-xs font-bold truncate"></p>
            <p id="menuEmail" class="text-[11px] text-slate-500 truncate mb-3"></p>
            <button onclick="logoutUser()" class="w-full py-2 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold">🚪 Logout</button>
          </div>
        </div>
      </header>

      <!-- Clean Cards Grid -->
      <div id="homeCardsGrid" class="p-4 grid grid-cols-1 gap-3.5 flex-1 content-start bg-[#F4F6F5]"></div>
    </div>

    <!-- VIEW B: UNIFIED MODULE VIEW -->
    <div id="moduleView" class="hidden flex-1 flex flex-col h-screen">
      <!-- Unified WhatsApp-Style Header (Back arrow + Avatar + Title seamlessly joined) -->
      <header class="bg-[#075E54] text-white px-2.5 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <button onclick="goHome()" aria-label="Back" class="flex items-center gap-1.5 py-1 pl-1.5 pr-2 rounded-full hover:bg-white/15 active:scale-95 transition shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            <span id="modHeaderIcon" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-lg">🌿</span>
          </button>
          <div class="min-w-0">
            <h2 id="modHeaderTitle" class="font-bold text-[15px] leading-tight truncate">Assistant</h2>
            <p id="modHeaderSub" class="text-[11px] text-emerald-100/90 flex items-center gap-1 truncate">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 inline-block"></span>
              <span>सक्रिय</span>
            </p>
          </div>
        </div>

        <!-- Compact Font Size Pill -->
        <div class="flex items-center gap-1 bg-black/20 px-2.5 py-1 rounded-full text-xs font-bold shrink-0">
          <button onclick="changeFontSize(-1)" class="px-1 hover:text-emerald-200">A-</button>
          <span id="fontSizeLabel" class="text-emerald-100 px-1">15</span>
          <button onclick="changeFontSize(1)" class="px-1 hover:text-emerald-200">A+</button>
        </div>
      </header>

      <!-- Universal Chat Container -->
      <div id="chatContainer" class="hidden flex-1 flex flex-col min-h-0"></div>

      <!-- Morning Studio Container -->
      <div id="morningContainer" class="hidden flex-1 overflow-y-auto px-3.5 py-4 space-y-4 bg-[#F4F6F5]"></div>
    </div>

    <!-- Clean Sidebar Drawer -->
    <div id="drawerOverlay" class="hidden fixed inset-0 z-50 flex">
      <div onclick="toggleDrawer(false)" class="fixed inset-0 bg-slate-900/50"></div>
      <aside class="relative w-72 max-w-[82vw] bg-white h-full shadow-2xl p-5 flex flex-col justify-between z-10">
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3.5">
            <span class="font-bold text-slate-800 text-sm">🌿 सारथी सेटिंग्स</span>
            <button onclick="toggleDrawer(false)" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500">✕</button>
          </div>

          <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/70 space-y-2">
            <p class="text-xs font-bold text-slate-700">🔠 अक्षर का आकार (Font Size)</p>
            <div class="flex items-center justify-between bg-white rounded-xl p-1.5 border border-slate-200">
              <button onclick="changeFontSize(-1)" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">A- छोटा</button>
              <span id="drawerFontVal" class="text-xs font-bold text-[#075E54]">15 px</span>
              <button onclick="changeFontSize(1)" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">A+ बड़ा</button>
            </div>
          </div>

          <div class="space-y-1.5">
            <a id="adminMenuLink" href="/admin" class="hidden w-full py-2.5 px-3.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-[#075E54] font-bold text-xs flex items-center gap-2">
              🛡️ Admin Control Panel
            </a>
            <button onclick="openMorningSettings()" class="w-full text-left py-2.5 px-3.5 rounded-xl hover:bg-slate-100 text-slate-700 font-semibold text-xs flex items-center gap-2">
              🌅 Morning Card Signature
            </button>
            <button onclick="clearLocalChatCache()" class="w-full text-left py-2.5 px-3.5 rounded-xl hover:bg-rose-50 text-rose-600 font-semibold text-xs flex items-center gap-2">
              🗑️ Local Chat History साफ़ करें
            </button>
          </div>
        </div>

        <div class="border-t border-slate-100 pt-3.5 text-[11px] text-slate-400 space-y-0.5">
          <p id="drawerLimitInfo">DB Chat Limit: 10 chats</p>
          <p>Model: gemini-3.5-flash-lite</p>
        </div>
      </aside>
    </div>

  </div>

  <script src="/js/acupressure.js"></script>
  <script src="/js/vastu.js"></script>
  <script src="/js/morning.js"></script>
  <script src="/js/chat-ui.js"></script>
  <script src="/js/core.js"></script>
</body>
</html>
